# Configuración de Nginx para gym-remote-api
# Este archivo debe colocarse en: /etc/nginx/sites-available/gym-api
# Luego crear symlink: sudo ln -s /etc/nginx/sites-available/gym-api /etc/nginx/sites-enabled/

# Definición de zona de rate limiting para protección contra abuso
# Limita requests basándose en la IP del cliente ($binary_remote_addr)
# zone=api_limit: Nombre de la zona, 10m de memoria (aprox. 160k IPs)
# rate=10r/s: Permite 10 requests por segundo por IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Zona específica para endpoints de autenticación (más restrictiva)
# rate=5r/m: Solo 5 requests por minuto para evitar brute force
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Definir upstream para el backend de Bun/Hono
# upstream: grupo de servidores backend que Nginx puede balancear
# En este caso, solo un servidor local
upstream gym_backend {
    # El servidor Bun/Hono escuchando en localhost:8080
    # Solo accesible localmente, no expuesto a Internet
    server 127.0.0.1:8080;
    
    # Keepalive: Mantener conexiones abiertas para mejor rendimiento
    # 64 conexiones simultáneas reutilizables
    keepalive 64;
}

# BLOQUE HTTP (Puerto 80)
# Redirige TODO el tráfico HTTP a HTTPS
server {
    # Escuchar en IPv4 e IPv6 en puerto 80 (HTTP)
    listen 80;
    listen [::]:80;
    
    # Nombre del dominio/subdominio
    # CAMBIAR ESTO por tu dominio real
    server_name api.ejemplo.com;
    
    # Redirección permanente (301) de HTTP a HTTPS
    # $host: mantiene el dominio
    # $request_uri: mantiene la ruta y query string
    return 301 https://$host$request_uri;
}

# BLOQUE HTTPS (Puerto 443)
# Servidor principal con SSL/TLS
server {
    # Escuchar en puerto 443 con SSL habilitado
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Nombre del dominio - debe coincidir con el certificado SSL
    # CAMBIAR ESTO por tu dominio real
    server_name api.ejemplo.com;
    
    # ============================================
    # CONFIGURACIÓN SSL/TLS
    # ============================================
    
    # Rutas a los certificados SSL (generados por certbot)
    # Certbot actualiza estas rutas automáticamente
    ssl_certificate /etc/letsencrypt/live/api.ejemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ejemplo.com/privkey.pem;
    
    # Configuración SSL adicional de certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Protocolos SSL permitidos: TLS 1.2 y 1.3 (versiones seguras)
    # No permitir TLS 1.0 o 1.1 (obsoletos y vulnerables)
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Preferir cifrados del servidor sobre los del cliente
    ssl_prefer_server_ciphers on;
    
    # Cifrados permitidos (modernos y seguros)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    
    # ============================================
    # HEADERS DE SEGURIDAD
    # ============================================
    
    # HSTS: Fuerza HTTPS por 1 año (31536000 segundos)
    # includeSubDomains: aplica a todos los subdominios
    # preload: permite inclusión en lista de preload de navegadores
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # X-Frame-Options: Previene clickjacking
    # DENY: no permite iframe de ningún sitio
    add_header X-Frame-Options "DENY" always;
    
    # X-Content-Type-Options: Previene MIME sniffing
    # nosniff: el navegador debe respetar el Content-Type declarado
    add_header X-Content-Type-Options "nosniff" always;
    
    # X-XSS-Protection: Protección XSS del navegador
    # 1; mode=block: activa filtro y bloquea página si detecta XSS
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer-Policy: Controla información de referrer enviada
    # no-referrer: no envía header Referer
    add_header Referrer-Policy "no-referrer" always;
    
    # ============================================
    # CONFIGURACIÓN GENERAL
    # ============================================
    
    # No mostrar versión de Nginx en headers/errores
    # Oculta información que podría ayudar a atacantes
    server_tokens off;
    
    # Tamaño máximo de body del request: 10 MB
    # Ajustar según necesidades (uploads de imágenes, etc.)
    client_max_body_size 10M;
    
    # Tamaño de buffer para el header del request
    client_header_buffer_size 1k;
    
    # Tamaño y número máximo de buffers para headers grandes
    large_client_header_buffers 4 8k;
    
    # ============================================
    # LOGGING
    # ============================================
    
    # Access log: registra todos los accesos
    access_log /var/log/nginx/gym-api-access.log;
    
    # Error log: registra errores (nivel: warn)
    error_log /var/log/nginx/gym-api-error.log warn;
    
    # ============================================
    # COMPRESIÓN GZIP
    # ============================================
    
    # Habilitar compresión gzip para reducir tamaño de respuesta
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    
    # ============================================
    # LOCATION: Endpoint de Health Check
    # ============================================
    
    # Endpoint público para verificar estado del servidor
    location = /health {
        # Aplicar rate limiting general
        limit_req zone=api_limit burst=20 nodelay;
        
        # Proxy pass al backend
        proxy_pass http://gym_backend;
        
        # Headers necesarios para el proxy
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }
    
    # ============================================
    # LOCATION: Endpoints de Autenticación
    # ============================================
    
    # Rutas de login - rate limiting más estricto para prevenir brute force
    location /auth {
        # Rate limiting estricto: 5 requests/minuto, burst de 5
        # nodelay: procesa el burst inmediatamente sin delay
        limit_req zone=auth_limit burst=5 nodelay;
        
        # Proxy pass al backend
        proxy_pass http://gym_backend;
        
        # HTTP 1.1 requerido para keepalive
        proxy_http_version 1.1;
        
        # No cerrar conexión entre requests (keepalive)
        proxy_set_header Connection "";
        
        # Headers para pasar información del cliente original
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts para autenticación
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # ============================================
    # LOCATION: API Principal
    # ============================================
    
    # Todas las demás rutas (CRUD, sync, etc.)
    location / {
        # Rate limiting general: 10 req/s con burst de 20
        limit_req zone=api_limit burst=20 nodelay;
        
        # Proxy pass al backend de Bun
        proxy_pass http://gym_backend;
        
        # HTTP 1.1 para keepalive
        proxy_http_version 1.1;
        
        # Mantener conexión abierta
        proxy_set_header Connection "";
        
        # Headers de proxy - información del cliente real
        # Host: dominio original solicitado
        proxy_set_header Host $host;
        
        # X-Real-IP: IP real del cliente
        proxy_set_header X-Real-IP $remote_addr;
        
        # X-Forwarded-For: cadena de IPs (cliente -> proxies)
        # $proxy_add_x_forwarded_for agrega la IP actual a la lista
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # X-Forwarded-Proto: protocolo original (http/https)
        # Importante para que la app sepa si request original fue HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # X-Forwarded-Host: host/dominio original
        proxy_set_header X-Forwarded-Host $host;
        
        # X-Forwarded-Port: puerto original (443 para HTTPS)
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Upgrade y Connection para WebSockets (si se usan en futuro)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts del proxy
        # connect: tiempo para establecer conexión con backend
        proxy_connect_timeout 60s;
        
        # send: tiempo para enviar request al backend
        proxy_send_timeout 60s;
        
        # read: tiempo para leer respuesta del backend
        proxy_read_timeout 60s;
        
        # Buffering de respuesta del backend
        # off: envía datos al cliente conforme llegan (streaming)
        # on: almacena respuesta completa antes de enviar
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }
    
    # ============================================
    # LOCATION: Bloquear archivos sensibles
    # ============================================
    
    # Bloquear acceso a archivos .env, .git, etc.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
